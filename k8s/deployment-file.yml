apiVersion: apps/v1
kind: Deployment
metadata:
  name: moneylens-app
  labels:
    app: moneylens
spec:
  replicas: 1
  selector:
    matchLabels:
      app: moneylens
  template:
    metadata:
      labels:
        app: moneylens
    spec:
      containers:
        - name: moneylens-container
          image: 029533636646.dkr.ecr.us-east-1.amazonaws.com/my_ecr:moneylens-latest
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: moneylens-service
  labels:
    app: moneylens
spec:
  selector:
    app: moneylens
  ports:
    - name: http
      port: 80
      targetPort: http
  type: LoadBalancer

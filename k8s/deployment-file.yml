# -------------------------------------
# 1. ExternalSecret for MoneyLens Application
# -------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: moneylens-secrets
  namespace: my-apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: moneylens-secrets   # <- the k8s Secret the deployment reads via envFrom
    creationPolicy: Owner
    template:
      data:
        USERNAME: "{{ .username }}"
        API_KEY: "{{ .api_key }}"
  data:
    - secretKey: username
      remoteRef: { key: moneylens/demo-secret, property: username }
    - secretKey: api_key
      remoteRef: { key: moneylens/demo-secret, property: api_key }

---

# -------------------------------------
# 2. Deployment 
# ---------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moneylens-app
  namespace: my-apps
  labels:
    app: moneylens
spec:
  replicas: 1
  selector:
    matchLabels:
      app: moneylens
  template:
    metadata:
      labels:
        app: moneylens
    spec:
      containers:
        - name: moneylens-container
          image: 029533636646.dkr.ecr.us-east-1.amazonaws.com/my_ecr:moneylens-latest
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          envFrom:
            - secretRef:
                name: moneylens-secrets
---

# -------------------------------------
# 3. Service
# ---------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: moneylens-service
  namespace: my-apps
  labels:
    app: moneylens
spec:
  selector:
    app: moneylens
  ports:
    - name: http
      port: 80
      targetPort: http
  type: LoadBalancer
